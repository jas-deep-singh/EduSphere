<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-GRAD</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class = "main_heading">
        <h1>E-GRAD</h1>
    </div>
    <div class="nav">
    
    <!-- LEFT SIDE -->
        <div class="nav-links">
            <a href="">MY PAGE</a>
            <a href="">FORUM</a>
            <a href="">E - EXAM</a>
        </div>

        <!-- RIGHT SIDE -->
        <div class="auth-buttons">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
        </div>

    </div>
    <h2>LOGIN</h2>
    <form onsubmit="sendData(event)">
        <table>
            <tr>
                <td>SIC</td>
                <td><input type="text" name="sic"></td>
            </tr>
            <tr>
                <td>PASSWORD</td>
                <td><input type="text" name="password"></td>
            </tr>
        </table>
        <input type="submit" value="Submit">
    </form>
<br>
    <input type="text" id = "bigNameBox" readonly >
    <br>
    <input type="text" id = "smolNameBox" readonly >
    
    <script>
function sendData(event) {
    event.preventDefault(); // stop page reload

    let sic = document.getElementsByName("sic")[0].value;
    let password = document.getElementsByName("password")[0].value;

    fetch("protobackend", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "sic=" + sic + "&password=" + password
    })
    .then(response => response.text())
    .then(data => {
        let parts = data.split(",");

        document.getElementById("bigNameBox").value = parts[0];
        document.getElementById("smolNameBox").value = parts[1];
    });
}
</script>
    

</body>
</html>
